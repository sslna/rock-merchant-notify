name: Merchant Notify

on:
  schedule:
    - cron: "50-59/5 7,11,15,19 * * *"
      timezone: "Asia/Shanghai"
    - cron: "0-50/5 8,12,16,20 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Ignore refresh window and run immediately"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      MERCHANT_URL: "https://www.onebiji.com/hykb_tools/comm/lkwgmerchant/preview.php?id=1&immgj=0"
      TIMEZONE: "Asia/Shanghai"
      REFRESH_TIMES: "08:00,12:00,16:00,20:00"
      REFRESH_WINDOW_MINUTES: "60"
      WATCH_ITEMS: ""
      NOTIFY_ON_FIRST_RUN: "true"
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run merchant notifier
        run: python main.py

      - name: Commit state changes
        run: |
          if [ -z "$(git status --porcelain -- data/latest.json data/history.jsonl)" ]; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.jsonl
          git commit -m "chore: update merchant state"
          git push
